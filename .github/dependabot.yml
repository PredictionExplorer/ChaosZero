# Dependabot version updates. Security updates are separate: enable
# "Dependabot security updates" in Settings > Code security; they ignore the
# schedule, the cooldown and the grouping below and open as soon as an
# advisory is published.
#
# Pinned tool versions in tools/versions.env (Foundry, solc, Slither, Halmos,
# the linters) are outside Dependabot's reach and are bumped by hand.
version: 2

updates:
  # Every action is pinned to a commit SHA with its release in a comment;
  # Dependabot updates both together. One grouped PR per week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    # Let a release age a week first: most compromised or broken releases are
    # caught and yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The frontend (pnpm; Dependabot reads pnpm-lock.yaml). Minor and patch
  # releases arrive together in one PR; every major gets its own PR, because
  # majors are where the migration work is.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10

  # forge-std (test and script helper only; the deployed bytecode does not
  # depend on it). Dependabot proposes the newest commit of the submodule's
  # branch: when merging, check it is a tagged release and update the tag
  # and rev in foundry.lock to match (forge install forge-std@vX.Y.Z does both).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
