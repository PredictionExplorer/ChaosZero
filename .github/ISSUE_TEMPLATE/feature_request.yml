name: Feature request
description: Suggest an improvement to the app, the tooling or the docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The deployed contract cannot be changed: it has no owner and no upgrade path, so a contract feature means a new deployment. App, tooling and docs ideas are the easiest to ship.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Contract (needs a new deployment)
        - Local development, tests or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
