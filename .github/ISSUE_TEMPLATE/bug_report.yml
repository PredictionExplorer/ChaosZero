name: Bug report
description: Something in the app, the contract integration or the tooling does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities must not be filed here:** report them privately as described in [SECURITY.md](https://github.com/PredictionExplorer/ChaosZero/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (chaoszero.com)
        - Contract behaviour
        - Local development, tests or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including error messages or toasts, copied as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://chaoszero.com/?round=...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Whatever applies.
      placeholder: |
        Round: ...
        Transaction hash: 0x...
        Browser and wallet: ...
        For local development: OS, output of `make doctor`, commit
  - type: checkboxes
    id: not-security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability (those go to private reporting).
          required: true
