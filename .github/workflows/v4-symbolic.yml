name: V4 symbolic accounting

on:
  pull_request:
    branches: [V4]
  push:
    branches: [V4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: verification/symbolic/requirements.txt
      - name: Install the locked symbolic executor and solver
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps
          -r verification/symbolic/requirements.txt
      - name: Check fail-closed report validation
        run: python -m unittest discover -s verification/symbolic
      - name: Prove cycle funding and claim backing
        run: python verification/symbolic/verify.py
      - name: Upload proof paths and solver outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v4-symbolic-results
          path: .local/symbolic/results*.json
          include-hidden-files: true
