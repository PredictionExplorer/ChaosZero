name: V4 contract static analysis

on:
  pull_request:
    branches: [V4]
  push:
    branches: [V4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slither:
    name: Compare V4 Slither findings with reviewed reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: verification/static/requirements.txt
      - name: Install locked analyzer
        run: |
          python -m venv .local/static-venv
          .local/static-venv/bin/pip install --require-hashes --only-binary=:all: --no-deps -r verification/static/requirements.txt
          .local/static-venv/bin/pip check
      - run: python -m unittest discover -s verification/static
      - run: .local/static-venv/bin/python verification/static/check.py
      - name: Preserve the full scanner report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v4-slither
          path: .local/static/results.json
          include-hidden-files: true
