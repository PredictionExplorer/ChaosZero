# CodeQL code scanning with the security-extended query suites: the
# TypeScript frontend, and the GitHub Actions workflows themselves (injection,
# untrusted checkouts, excessive permissions). Solidity is covered by Slither
# in ci.yml. Results land in the repository's Security tab and on pull
# requests.
#
# This is CodeQL's "advanced setup": the repository's code scanning "default
# setup" must stay disabled, or GitHub rejects these uploads.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Weekly, so new queries also run while the code is quiet.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Both are interpreted languages: CodeQL reads the sources directly.
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
