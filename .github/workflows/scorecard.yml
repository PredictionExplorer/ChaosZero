# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, code review, SAST,
# dangerous workflows, ...) and publishes the result to the public Scorecard
# API, which also serves the README badge. Findings appear in the Security tab.
#
# publish_results imposes rules on this file, checked by the Scorecard API:
# no top-level env or defaults, no write permissions at the top level, and
# only allow-listed actions in the job (checkout, upload-artifact,
# codeql-action/upload-sarif, scorecard-action, harden-runner).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  # Re-grade as soon as branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out and read the repository
      actions: read # read workflow runs (CI-Tests, SAST checks)
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to the Scorecard API
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the SARIF report as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload the SARIF report to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
