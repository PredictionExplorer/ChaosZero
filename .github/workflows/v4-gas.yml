name: V4 market gas snapshots

on:
  pull_request:
    branches: [V4, main]
  push:
    branches: [V4, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gas:
    name: Check isolated V4 market calls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: forge fmt --check benchmarks
      - run: node scripts/check-v4-gas.mjs
